name: collect
on:
  schedule:
    # offset from :00/:15/:30/:45 — GitHub deprioritizes crons on those exact
    # marks under high platform load, which is why the first hour saw zero runs
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
jobs:
  hit-collect-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/collect
        run: |
          code=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/collect")
          echo "HTTP $code"
          cat /tmp/body.json
          if [ "$code" != "200" ]; then
            echo "::error::collect endpoint returned $code"
            exit 1
          fi
